server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://mysql-db:3306/dni_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
reniec.api.url=https://api.decolecta.com/v1/reniec/dni
reniec.api.token=${RENIEC_TOKEN}
reniec.api.timeout=5000
